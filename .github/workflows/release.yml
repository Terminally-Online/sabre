name: Build and Release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

permissions:
  contents: write
  packages: write

env:
  GO_VERSION: "1.25"

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      v: ${{ steps.pick.outputs.v }}
      series: ${{ steps.pick.outputs.series }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A tag push carries its own version. A merge to master does not, and a
      # merge that nobody versions publishes nothing while master looks correct
      # — which is how the deployed image sat months behind its own repository.
      # Deriving it here rather than in a separate workflow is deliberate: a tag
      # pushed by GITHUB_TOKEN does not trigger another workflow, so a tagging
      # job that hands off to this one would tag releases that never build.
      - name: Pick the version
        id: pick
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            v="${GITHUB_REF#refs/tags/v}"
          else
            latest=$(git tag --list 'v*' --sort=-v:refname | head -1)
            if [ -z "$latest" ]; then
              v="0.1.0"
            else
              subjects=$(git log "$latest"..HEAD --pretty=%s)
              if [ -z "$subjects" ]; then
                echo "nothing new since $latest"
                exit 0
              fi
              major=$(echo "${latest#v}" | cut -d. -f1)
              minor=$(echo "${latest#v}" | cut -d. -f2)
              patch=$(echo "${latest#v}" | cut -d. -f3)
              if git log "$latest"..HEAD --pretty='%s%n%b' | grep -qE '^BREAKING CHANGE|^[a-z]+(\([^)]*\))?!:'; then
                major=$((major + 1)); minor=0; patch=0
              elif echo "$subjects" | grep -qE '^feat(\([^)]*\))?:'; then
                minor=$((minor + 1)); patch=0
              else
                patch=$((patch + 1))
              fi
              v="${major}.${minor}.${patch}"
            fi
          fi
          echo "v=$v" >> "$GITHUB_OUTPUT"
          echo "series=$(echo "$v" | cut -d. -f1-2)" >> "$GITHUB_OUTPUT"
          echo "version $v"

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run tests
        run: go test -v -race -coverprofile=coverage-release.txt -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage-release.txt
          flags: unittests
          name: codecov-umbrella

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ""
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            ext: ""
          - os: windows-latest
            goos: windows
            goarch: amd64
            ext: ".exe"
          - os: macos-latest
            goos: darwin
            goarch: amd64
            ext: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -ldflags "-X main.Version=${{ github.ref_name }} -X main.BuildTime=$(date -u '+%Y-%m-%d_%H:%M:%S')" -o sabre-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} ./cmd/sabre

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sabre-${{ matrix.goos }}-${{ matrix.goarch }}
          path: sabre-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: [version, test, build]
    if: needs.version.outputs.v != ''
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/terminally-online/sabre:${{ needs.version.outputs.v }}
            ghcr.io/terminally-online/sabre:${{ needs.version.outputs.series }}
            ghcr.io/terminally-online/sabre:latest
          build-args: |
            VERSION=${{ needs.version.outputs.v }}

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [version, test, build, docker]
    if: needs.version.outputs.v != ''
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ needs.version.outputs.v }}
          release_name: Release v${{ needs.version.outputs.v }}
          draft: false
          prerelease: false

      - name: Upload Release Assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./sabre-linux-amd64/sabre-linux-amd64
          asset_name: sabre-linux-amd64
          asset_content_type: application/octet-stream

      - name: Upload Release Assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./sabre-linux-arm64/sabre-linux-arm64
          asset_name: sabre-linux-arm64
          asset_content_type: application/octet-stream

      - name: Upload Release Assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./sabre-darwin-amd64/sabre-darwin-amd64
          asset_name: sabre-darwin-amd64
          asset_content_type: application/octet-stream

      - name: Upload Release Assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./sabre-windows-amd64/sabre-windows-amd64.exe
          asset_name: sabre-windows-amd64.exe
          asset_content_type: application/octet-stream
